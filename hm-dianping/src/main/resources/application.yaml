server:
  address: 127.0.0.1
  port: 18081
spring:
  application:
    name: dianping-practice
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/dianping_practice?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    initialization-mode: never
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:16379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 2s
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 0
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: com.hmdp.entity
logging:
  level:
    com.hmdp: debug


